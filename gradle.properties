# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

# Compose Multiplatform / wasm
org.jetbrains.compose.experimental.wasm.enabled=true
# CMP 1.11 Gradle plugin predates Kotlin 2.4; the compiler reads its older klibs fine.
org.jetbrains.compose.suppressKotlinVersionCompatibilityCheck=2.4.10
kotlin.native.ignoreDisabledTargets=true

# AGP 9 + Kotlin Multiplatform interop: the built-in Kotlin / new DSL in AGP 9
# is not yet compatible with the multiplatform plugin in an application module.
android.builtInKotlin=false
android.newDsl=false
