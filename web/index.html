<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kaleido — Product Catalog</title>
    <style>
        :root { color-scheme: light dark; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { background: #FBF9FF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        #loader {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: #6C4CE0; letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="loader">Loading Kaleido…</div>
    <script src="kaleido.js"></script>
    <script>
        window.addEventListener('load', () => {
            const l = document.getElementById('loader');
            if (l) setTimeout(() => l.remove(), 400);
        });
    </script>
</body>
</html>
