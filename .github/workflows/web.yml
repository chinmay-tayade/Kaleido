name: Build web bundle

# Rebuilds the static Kotlin/Wasm site into web/ and commits it back, so the
# Vercel project (which just serves web/) always tracks the latest source.

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/src/**'
      - 'composeApp/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build production web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Sync into web/
        run: |
          rm -rf web
          mkdir -p web
          cp -R composeApp/build/dist/wasmJs/productionExecutable/. web/

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain web)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web
            git commit -m "ci: rebuild web bundle [skip ci]"
            git push
          else
            echo "web/ already up to date"
          fi
